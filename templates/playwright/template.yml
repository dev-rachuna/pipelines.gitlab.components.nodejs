---
spec:
  description: "Instaluje zależności, uruchamia testy end-to-end Playwright oraz publikuje raporty JUnit i HTML wraz z artefaktami testowymi."
  component: [name, version, reference]
  inputs:
    job-name:
      type: string
      default: playwright-e2e
      description: "Nazwa joba GitLab CI uruchamiającego testy Playwright."
    job-stage:
      default: tests
      description: "Etap pipeline GitLab CI, w którym zostanie uruchomiony job z testami Playwright."
      options: [".pre", "prepare", "dependency", "validate", "build", "deployment", "tests", "publish", ".post"]
    job-image:
      description: "Obraz kontenera joba zawierający Node.js oraz przeglądarki wymagane przez Playwright."
      type: string
      default: registry.gitlab.com/dev.rachuna/artifacts/containers/playwright:1.0.0
    job-rules:
      description: "Reguły GitLab CI przekazywane do pola rules, określające warunki dodania joba do pipeline."
      type: array
      default:
        - when: on_success
    job-needs:
      description: "Lista zależności przekazywana do pola needs joba GitLab CI."
      type: array
      default: []
    job-resource-group:
      description: "Nazwa grupy zasobów przekazywana do resource_group i ograniczająca równoległe uruchamianie joba."
      type: string
      default: "${CI_PIPELINE_ID}-${CI_JOB_NAME}"
    job-before-script:
      description: "Dodatkowy skrypt wykonywany po npm ci, bezpośrednio przed uruchomieniem testów."
      type: string
      default: ":"
    job-after-script:
      description: "Dodatkowy skrypt wykonywany w after_script po zakończeniu testów i skryptu bootstrap."
      type: string
      default: ":"
    job-install-dependency:
      type: boolean
      default: false
      description: "Określa, czy przed npm ci zainstalować globalnie najnowszą wersję pakietu @playwright/cli."
    job-external-repository-fullpath:
      type: string
      default: ""
      description: "Pełna ścieżka namespace/projekt zewnętrznego repozytorium GitLab z testami; pusta wartość uruchamia testy z bieżącego projektu."
    job-external-repository-ref:
      type: string
      default: "feat/init"
      description: "Gałąź, tag lub inny ref klonowany z repozytorium wskazanego przez job-external-repository-fullpath."
---
"$[[ inputs.job-name ]]":
  image: "$[[ inputs.job-image ]]"
  stage: "$[[ inputs.job-stage ]]"
  rules: "$[[ inputs.job-rules ]]"
  needs: "$[[ inputs.job-needs ]]"
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - .playwright-external-repository/playwright-report/
      - .playwright-external-repository/test-results/
    reports:
      junit: test-results/results.xml
  cache: {}
  # cache:
  #   key:
  #     files:
  #       - package-lock.json
  #   paths:
  #     - node_modules/
  resource_group: "$[[ inputs.job-resource-group ]]"
  variables:
    GITLAB_CI_COMPONENTS_PATH: dev.rachuna/pipelines/gitlab/components/bootstrap
    GITLAB_CI_COMPONENTS_VERSION: "$[[ component.reference ]]"
    DOCS_MD_FILE_PATH: templates/$[[ component.name ]]/README.md
    NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    PLAYWRIGHT_INSTALL_DEPENDENCY: "$[[ inputs.job-install-dependency ]]"
    PLAYWRIGHT_EXTERNAL_REPOSITORY_FULLPATH: "$[[ inputs.job-external-repository-fullpath ]]"
    PLAYWRIGHT_EXTERNAL_REPOSITORY_REF: "$[[ inputs.job-external-repository-ref ]]"
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: "${CI_PROJECT_DIR}/test-results/results.xml"
  extends:
    - .before_script
    - .after_script
  before_script:
    - !reference [.before_script, before_script]
    - | # install playwright
      if [[ "$PLAYWRIGHT_INSTALL_DEPENDENCY" == "true" ]]; then
        npm i -g @playwright/cli@latest
      fi
    - | 
      if [[ -n "$PLAYWRIGHT_EXTERNAL_REPOSITORY_FULLPATH" ]]; then
        glab repo clone "$PLAYWRIGHT_EXTERNAL_REPOSITORY_FULLPATH" \
          "${CI_PROJECT_DIR}/.playwright-external-repository" \
          -- --branch $PLAYWRIGHT_EXTERNAL_REPOSITORY_REF
        cd "${CI_PROJECT_DIR}/.playwright-external-repository"
      fi
      npm ci
    - $[[ inputs.job-before-script ]]
  script:
    - |
      if [[ -n "$PLAYWRIGHT_EXTERNAL_REPOSITORY_FULLPATH" ]]; then
        cd "${CI_PROJECT_DIR}/.playwright-external-repository"
      fi
      npx playwright test --reporter=list,junit,html
  after_script:
    - !reference [.after_script, after_script]
    - $[[ inputs.job-after-script ]]
